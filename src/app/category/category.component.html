<section class="category-section" aria-labelledby="category-title">
  <div class="category-section-inner">
    <header class="category-header">
      <div>
        <p class="category-eyebrow">Find your next favorite</p>
        <h2 id="category-title">Shop by category</h2>
      </div>
      <p class="category-description">Explore popular picks and discover something new.</p>
    </header>

    <div class="category-container">
      <article class="category" *ngFor="let category of categories">
        <div class="category-image">
          <img [src]="category.image" [alt]="category.alt" loading="lazy" />
          <span class="category-image-label">{{ category.name }}</span>
        </div>
        <div class="category-details">
          <h3>{{ category.name }}</h3>
          <ul class="subcategory-list" [attr.aria-label]="category.name + ' subcategories'">
            <li *ngFor="let subcategory of category.subcategories">
              <a
                [routerLink]="['/category', category.slug]"
                [queryParams]="{ subcategory: subcategory }"
                >{{ subcategory }}</a
              >
            </li>
          </ul>
          <a class="category-view-all" [routerLink]="['/category', category.slug]">
            Shop all {{ category.name }} <span aria-hidden="true">&rarr;</span>
          </a>
        </div>
      </article>
    </div>
  </div>
</section>
